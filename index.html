<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>קורא מהיר</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

<style>
:root{--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--ok:#34d399;--danger:#fb7185;--border:#334155;--red:#ff3b30;--zoom:1}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;min-height:100svh;padding:clamp(10px,3vw,16px);font-family:system-ui,Arial,sans-serif;background:linear-gradient(145deg,#020617,#0f172a);color:var(--text)}.wrap{width:min(1060px,100%);margin:auto}h1{font-size:clamp(26px,7vw,46px);margin:6px 0}.sub,.hint,.status{color:var(--muted);line-height:1.45}.stack{display:flex;flex-direction:column;gap:14px}.panel{width:100%;background:rgba(17,24,39,.92);border:1px solid var(--border);border-radius:22px;padding:clamp(10px,3vw,16px);box-shadow:0 20px 50px #0005}.settingsGrid{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:850px){.settingsGrid{grid-template-columns:minmax(0,1fr) minmax(260px,.85fr)}}textarea{width:100%;min-height:190px;border-radius:16px;padding:13px;font-size:16px;line-height:1.55;background:#020617;color:var(--text);border:1px solid var(--border);direction:auto;resize:vertical}label{display:block;margin:12px 0 6px;font-weight:800}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;max-width:100%}button,select,input[type=number],input[type=text],input[type=file]{border-radius:14px;padding:10px 12px;font-size:16px;font-weight:800;max-width:100%}button{border:0;background:var(--accent);color:#04111c;cursor:pointer;min-height:42px}.secondary{background:#e2e8f0;color:#0f172a}.ok{background:var(--ok)}.danger{background:var(--danger);color:white}.gameBtn{background:#fbbf24;color:#281300}select,input[type=number],input[type=text],input[type=file]{background:#020617;color:var(--text);border:1px solid var(--border)}select{width:100%}input[type=text]{min-width:0;flex:1 1 220px}input[type=file]{width:100%;font-size:14px}.toggle{display:flex;gap:9px;align-items:center;margin-top:10px}.toggle input{width:20px;height:20px;flex:0 0 auto}.importBox,.toolBox{border:1px dashed var(--border);border-radius:18px;padding:12px;margin:12px 0;background:#02061755}.reader{min-height:42svh;border-radius:22px;background:radial-gradient(circle at top,#1e293b,#020617);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:18px;overflow:hidden}.word{font-size:clamp(42px,16vw,126px);font-weight:950;line-height:1.08;overflow-wrap:anywhere;max-width:100%;transform:scale(var(--zoom));transition:transform .12s ease}.red-letter{color:var(--red);text-shadow:0 0 18px #ff3b3088}.kid .word{font-size:clamp(52px,18vw,148px)}.focus:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#38bdf888}.meta{position:absolute;bottom:10px;inset-inline:12px;color:var(--muted);display:flex;justify-content:space-between;font-size:13px}.progress{height:12px;border-radius:99px;background:#020617;border:1px solid var(--border);overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.stat{background:#1e293b;border:1px solid var(--border);border-radius:16px;padding:10px;text-align:center;min-width:0}.stat b{display:block;font-size:clamp(17px,5vw,22px)}.stat span{color:var(--muted);font-size:12px}.rtl{direction:rtl}.ltr{direction:ltr}.readerControls button,.speedBox button{flex:1 1 auto}.speedBox{background:#02061788;border:1px solid var(--border);border-radius:18px;padding:10px;margin:10px 0}.feedback{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#231300;border-radius:999px;padding:8px 14px;font-weight:900;opacity:0;transition:.25s;z-index:3}.feedback.show{opacity:1;top:28px}.pseudoFull{position:fixed!important;inset:0!important;z-index:9999!important;border:0!important;border-radius:0!important;background:#020617!important;padding:14px!important;display:flex!important;flex-direction:column!important;justify-content:center!important}.pseudoFull .reader{min-height:72svh}.pseudoFull .stats{display:none}.fullPanel:fullscreen{background:#020617;border:0;border-radius:0;padding:16px;display:flex;flex-direction:column;justify-content:center;width:100vw;height:100vh}.fullPanel:fullscreen .reader{min-height:72vh}.fullPanel:fullscreen .stats{display:none}@media(max-width:520px){.row button{flex:1 1 calc(50% - 8px)}.readerControls button{font-size:15px;padding:10px 8px}.word{font-size:clamp(44px,18vw,92px)}.reader{min-height:46svh}.sub{font-size:14px}.panel{border-radius:18px}body{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="wrap"><h1>קורא מהיר</h1><p class="sub">קריאה מהירה, טקסט נקי, אות עוגן, מצב משחק, זמן פנוי ומסך מלא.</p><div class="stack">
<section id="readerPanel" class="panel fullPanel"><div class="speedBox"><div class="row"><button id="speedDown" class="secondary">− מהירות</button><b><span id="wpmLbl">300</span> WPM</b><button id="speedUp" class="secondary">+ מהירות</button><button id="zoomDown" class="secondary">− זום</button><b><span id="zoomLbl">100%</span></b><button id="zoomUp" class="secondary">+ זום</button></div><div class="row"><input id="minutes" type="number" min="1" max="120" value="5" title="דקות"><button id="timeBtn" class="secondary">יש לי X דקות</button><button id="gameBtn" class="gameBtn">מצב משחק</button></div></div><div id="reader" class="reader"><div id="feedback" class="feedback">יפה!</div><div id="word" class="word">מוכן?</div><div class="meta"><span id="count">0 / 0</span><span id="left">00:00</span></div></div><div class="progress"><div id="bar" class="bar"></div></div><div class="row readerControls"><button id="play" class="ok">התחל</button><button id="pause" class="secondary">עצור</button><button id="back" class="secondary">אחורה</button><button id="next" class="secondary">קדימה</button><button id="reset" class="danger">איפוס</button><button id="fullBtn" class="secondary">מסך מלא</button></div><div class="stats"><div class="stat"><b id="sWords">0</b><span id="unitLbl">יחידות</span></div><div class="stat"><b id="sDone">0%</b><span>התקדמות</span></div><div class="stat"><b id="sLeft">00:00</b><span>נותר</span></div><div class="stat"><b id="score">0</b><span>נקודות</span></div></div></section>
<section class="panel"><div class="settingsGrid"><div><label>טקסט לתרגול</label><textarea id="txt"></textarea><div class="importBox"><label>ייבוא קובץ</label><input id="fileIn" type="file" accept=".txt,.text,.docx,.pdf,.epub,text/plain,application/pdf,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><p id="importStatus" class="status">תומך TXT, DOCX, EPUB ו-PDF עם שכבת טקסט.</p><label>ייבוא מ-Google Docs ציבורי</label><div class="row"><input id="gdocUrl" type="text" placeholder="הדבק קישור Google Docs ציבורי"><button id="gdocBtn" class="secondary">ייבא</button></div></div><div class="row"><button id="load">טען</button><button id="he" class="secondary">דוגמה עברית</button><button id="en" class="secondary">English</button><button id="clear" class="danger">נקה</button></div><div class="toolBox"><label>ג׳נרטור טקסט רנדומלי</label><div class="row"><select id="level"><option value="easy">קל</option><option value="medium">בינוני</option><option value="hard">מתקדם</option></select><button id="genBtn" class="secondary">צור טקסט</button></div></div></div><div><label>מילים בכל פעימה</label><select id="chunk"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label>ניווט אחורה/קדימה</label><select id="navUnit"><option value="words">לפי מילים</option><option value="lines">לפי שורות</option></select><label>כיוון</label><select id="dir"><option value="auto">אוטומטי</option><option value="rtl">עברית</option><option value="ltr">English</option></select><label>מצב</label><select id="mode"><option value="regular">רגיל</option><option value="kid">ילדים</option><option value="focus">קו מיקוד</option></select><label>מיקום אות אדומה</label><select id="redPos"><option value="auto">אוטומטי</option><option value="start">תחילת מילה</option><option value="q1">רבע ראשון</option><option value="middle">אמצע</option><option value="q3">רבע שלישי</option><option value="end">סוף מילה</option></select><label class="toggle"><input id="redFocus" type="checkbox" checked> אות עוגן אדומה</label><label class="toggle"><input id="lettersOnly" type="checkbox" checked> הסר סימני פיסוק וסימנים</label><label class="toggle"><input id="stripNikud" type="checkbox" checked> עברית בלי ניקוד</label><p class="hint">במצב “שורות”, קדימה/אחורה מדלגים שורה. במצב “מילים”, לפי מספר המילים בכל פעימה.</p></div></div></section></div></div>
<script>
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
const $=id=>document.getElementById(id);let units=[],lines=[],i=0,timer=null,playing=false,pseudo=false,game=false,points=0,sessionEnd=null,zoom=1;const sampleHe='קריאה מהירה היא אימון של קשב קצב והבנה. האות האדומה משמשת כעוגן קטן לעין ומסייעת לשמור על קצב יציב.';const sampleEn='Speed reading is focused practice. The red anchor letter helps the eye land quickly and keeps the rhythm stable.';
function setStatus(s){importStatus.textContent=s}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cleanText(s){s=String(s||'');if(stripNikud.checked)s=s.replace(/[\u0591-\u05C7]/g,'');if(lettersOnly.checked)s=s.replace(/[^\p{L}\p{N}\s\n]/gu,' ');return s.replace(/[ \t]+/g,' ').replace(/\n\s+/g,'\n').trim()}function makeUnits(){let t=cleanText(txt.value);lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);let words=t.replace(/\n/g,' ').split(/\s+/).filter(Boolean);units=navUnit.value==='lines'?lines:words;unitLbl.textContent=navUnit.value==='lines'?'שורות':'מילים'}function anchorIndex(w){let a=[...w],n=a.length;if(n<2)return 0;let p=redPos.value;if(p==='start')return 0;if(p==='end')return n-1;if(p==='middle')return Math.floor(n/2);if(p==='q1')return Math.max(0,Math.floor(n*.25));if(p==='q3')return Math.min(n-1,Math.floor(n*.75));return n<5?Math.floor(n/2):Math.max(1,Math.floor(n*.4))}function paintOne(w){let a=[...w],j=anchorIndex(w);return a.map((c,k)=>k===j?'<span class="red-letter">'+esc(c)+'</span>':esc(c)).join('')}function paintPhrase(s){return String(s).split(' ').map(paintOne).join(' ')}
function save(){localStorage.readerApp=JSON.stringify({txt:txt.value,wpm:wpmLbl.textContent,chunk:chunk.value,dir:dir.value,mode:mode.value,red:redFocus.checked,letters:lettersOnly.checked,nikud:stripNikud.checked,redPos:redPos.value,nav:navUnit.value,zoom,i,points})}function restore(){try{let d=JSON.parse(localStorage.readerApp||'{}');txt.value=d.txt||sampleHe;setWpm(Number(d.wpm||300));chunk.value=d.chunk||1;dir.value=d.dir||'auto';mode.value=d.mode||'regular';redFocus.checked=d.red!==false;lettersOnly.checked=d.letters!==false;stripNikud.checked=d.nikud!==false;redPos.value=d.redPos||'auto';navUnit.value=d.nav||'words';zoom=d.zoom||1;points=d.points||0;i=d.i||0}catch(e){txt.value=sampleHe;setWpm(300)}}function heb(s){return /[\u0590-\u05FF]/.test(s)}function stepSize(){return navUnit.value==='lines'?1:Number(chunk.value)}function shown(){return units.slice(i,i+stepSize()).join(' ')}function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function wpm(){return Number(wpmLbl.textContent||300)}function setWpm(v){v=Math.max(80,Math.min(1200,Math.round(v/10)*10));wpmLbl.textContent=v}
function showFeedback(s){feedback.textContent=s;feedback.classList.add('show');setTimeout(()=>feedback.classList.remove('show'),750)}function unitWordCount(s){return String(s).trim().split(/\s+/).filter(Boolean).length||1}function update(){document.documentElement.style.setProperty('--zoom',zoom);zoomLbl.textContent=Math.round(zoom*100)+'%';let cur=units.length?shown():'הדבק טקסט וטען';word.innerHTML=redFocus.checked?paintPhrase(cur||'סיימת'):esc(cur||'סיימת');let d=dir.value==='auto'?(heb(cur||txt.value)?'rtl':'ltr'):dir.value;reader.classList.toggle('rtl',d==='rtl');reader.classList.toggle('ltr',d==='ltr');reader.classList.toggle('kid',mode.value==='kid');reader.classList.toggle('focus',mode.value==='focus');let done=units.length?Math.min(100,Math.round(i/units.length*100)):0;count.textContent=Math.min(i+1,units.length)+' / '+units.length;bar.style.width=done+'%';let rem=sessionEnd?Math.max(0,(sessionEnd-Date.now())/1000):(remainingWords()/wpm())*60;left.textContent=fmt(rem);sWords.textContent=units.length;sDone.textContent=done+'%';sLeft.textContent=fmt(rem);score.textContent=points;save()}function remainingWords(){return units.slice(i).join(' ').split(/\s+/).filter(Boolean).length}
function loadText(){makeUnits();i=Math.min(i,Math.max(0,units.length-1));update()}function stop(){playing=false;if(timer)clearInterval(timer);timer=null;sessionEnd=null}function tick(){if(sessionEnd&&Date.now()>=sessionEnd){stop();showFeedback('נגמר הזמן!');return}if(i>=units.length){stop();word.innerHTML=redFocus.checked?paintPhrase('סיימת'):'סיימת';bar.style.width='100%';showFeedback('סיימת!');return}let cur=shown();update();if(game){points+=unitWordCount(cur);if(points%50<unitWordCount(cur))showFeedback('בום! '+points+' נקודות')}i+=stepSize()}function intervalMs(){let cur=shown();let wc=unitWordCount(cur);return Math.max(60,60000/wpm()*wc)}function playRun(){if(!units.length)loadText();if(playing)return;playing=true;tick();timer=setInterval(tick,intervalMs())}
async function readEpub(buf){if(!window.ePub)throw new Error('ספריית EPUB לא נטענה');let book=ePub(buf),out=[];await book.ready;for(let item of book.spine.spineItems){try{await item.load(book.load.bind(book));let doc=item.document||item.contents;if(doc&&doc.body)out.push(doc.body.innerText||doc.body.textContent||'');item.unload()}catch(e){}}if(book.destroy)book.destroy();let text=out.join('\n\n').trim();if(text.replace(/\s/g,'').length<20)throw new Error('לא הצלחתי לחלץ טקסט מה-EPUB');return text}
async function readFileText(f){let name=f.name.toLowerCase();if(name.endsWith('.txt')||f.type.startsWith('text/'))return await f.text();let buf=await f.arrayBuffer();if(name.endsWith('.docx')){if(!window.mammoth)throw new Error('ספריית Word לא נטענה');let r=await mammoth.extractRawText({arrayBuffer:buf});return r.value}if(name.endsWith('.epub'))return await readEpub(buf);if(name.endsWith('.pdf')){if(!window.pdfjsLib)throw new Error('ספריית PDF לא נטענה');let pdf=await pdfjsLib.getDocument({data:buf}).promise,out=[];for(let p=1;p<=pdf.numPages;p++){let page=await pdf.getPage(p),tc=await page.getTextContent();out.push(tc.items.map(x=>x.str).join(' '))}let text=out.join('\n\n').trim();if(text.replace(/\s/g,'').length<20)throw new Error('לא נמצאה שכבת טקסט ב-PDF. כנראה מדובר בסריקה/תמונה, ונדרש OCR.');return text}throw new Error('סוג קובץ לא נתמך')}
function gdocToExport(url){let m=url.match(/document\/d\/([a-zA-Z0-9_-]+)/);if(m)return 'https://docs.google.com/document/d/'+m[1]+'/export?format=txt';let p=url.match(/document\/d\/e\/([a-zA-Z0-9_-]+)/);if(p)return 'https://docs.google.com/document/d/e/'+p[1]+'/pub?output=txt';return url}
function randomText(){let pools={easy:['בית','ילד','שמש','מים','דרך','ספר','כלב','עץ','חבר','שמחה','אור','ים'],medium:['קריאה','מהירות','תרגול','מחשבה','משמעות','ריכוז','מטרה','למידה','התקדמות','יכולת'],hard:['אסטרטגיה','התבוננות','קוגניציה','פרשנות','אינטנסיביות','התמודדות','התפתחות','מורכבות','אפקטיביות']};let arr=pools[level.value],n=level.value==='easy'?70:level.value==='medium'?110:150,out=[];for(let k=0;k<n;k++)out.push(arr[Math.floor(Math.random()*arr.length)]);txt.value=out.join(' ');i=0;loadText();showFeedback('נוצר טקסט')}
function toggleFull(){let p=readerPanel;let isFull=document.fullscreenElement||document.webkitFullscreenElement||pseudo;if(isFull){pseudo=false;p.classList.remove('pseudoFull');document.body.style.overflow='';fullBtn.textContent='מסך מלא';if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();return}let req=p.requestFullscreen||p.webkitRequestFullscreen;if(req){try{let r=req.call(p);if(r&&r.catch)r.catch(()=>{pseudo=true;p.classList.add('pseudoFull');document.body.style.overflow='hidden';fullBtn.textContent='צא ממסך מלא'});fullBtn.textContent='צא ממסך מלא';return}catch(e){}}pseudo=true;p.classList.add('pseudoFull');document.body.style.overflow='hidden';fullBtn.textContent='צא ממסך מלא'}
fileIn.onchange=async()=>{let f=fileIn.files[0];if(!f)return;try{setStatus('קורא את הקובץ...');let t=await readFileText(f);txt.value=t.trim();i=0;loadText();setStatus('הקובץ נטען: '+f.name+' · '+units.length+' יחידות')}catch(e){setStatus('שגיאה: '+e.message)}};gdocBtn.onclick=async()=>{let u=gdocUrl.value.trim();if(!u)return;try{setStatus('מייבא...');let r=await fetch(gdocToExport(u));if(!r.ok)throw new Error('המסמך לא נגיש');let t=await r.text();txt.value=t.trim();i=0;loadText();setStatus('Google Doc נטען')}catch(e){setStatus('לא הצלחתי לייבא: '+e.message)}};
load.onclick=()=>{i=0;loadText()};play.onclick=playRun;pause.onclick=stop;reset.onclick=()=>{stop();i=0;points=0;update()};back.onclick=()=>{i=Math.max(0,i-stepSize()*5);update()};next.onclick=()=>{i=Math.min(units.length,i+stepSize()*5);update()};he.onclick=()=>{txt.value=sampleHe;i=0;loadText()};en.onclick=()=>{txt.value=sampleEn;i=0;loadText()};clear.onclick=()=>{txt.value='';units=[];i=0;update()};speedDown.onclick=()=>{setWpm(wpm()-10);update()};speedUp.onclick=()=>{setWpm(wpm()+10);update()};zoomDown.onclick=()=>{zoom=Math.max(.7,zoom-.1);update()};zoomUp.onclick=()=>{zoom=Math.min(1.8,zoom+.1);update()};timeBtn.onclick=()=>{sessionEnd=Date.now()+Number(minutes.value||5)*60000;showFeedback(minutes.value+' דקות יוצאות לדרך');update()};gameBtn.onclick=()=>{game=!game;gameBtn.textContent=game?'משחק פעיל':'מצב משחק';showFeedback(game?'משחק פעיל!':'משחק כבוי')};genBtn.onclick=randomText;[chunk,dir,mode,redFocus,lettersOnly,stripNikud,redPos,navUnit].forEach(x=>x.onchange=()=>{loadText()});txt.oninput=()=>{makeUnits();i=Math.min(i,units.length);update()};fullBtn.onclick=toggleFull;document.addEventListener('keydown',e=>{if(e.code==='Escape'&&pseudo)toggleFull();if(e.code==='Space'){e.preventDefault();playing?stop():playRun()}if(e.code==='ArrowLeft'){i=Math.max(0,i-stepSize());update()}if(e.code==='ArrowRight'){i=Math.min(units.length,i+stepSize());update()}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});restore();makeUnits();update();
</script></body></html>
