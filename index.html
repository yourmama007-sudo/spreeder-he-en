<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<title>קורא מהיר</title>
<style>
:root{--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--ok:#34d399;--danger:#fb7185;--border:#334155}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;font-family:system-ui,Arial,sans-serif;background:linear-gradient(145deg,#020617,#0f172a);color:var(--text)}.wrap{max-width:980px;margin:auto}h1{font-size:clamp(28px,6vw,48px);margin:8px 0}.sub{color:var(--muted)}.grid{display:grid;gap:14px}@media(min-width:850px){.grid{grid-template-columns:1fr 1fr}}.panel{background:rgba(17,24,39,.9);border:1px solid var(--border);border-radius:24px;padding:16px;box-shadow:0 20px 50px #0005}textarea{width:100%;min-height:210px;border-radius:18px;padding:14px;font-size:17px;line-height:1.6;background:#020617;color:var(--text);border:1px solid var(--border);direction:auto}label{display:block;margin:12px 0 6px;font-weight:800}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input[type=number]{border:0;border-radius:14px;padding:11px 14px;font-size:16px;font-weight:800}button{background:var(--accent);color:#04111c;cursor:pointer}.secondary{background:#e2e8f0;color:#0f172a}.ok{background:var(--ok)}.danger{background:var(--danger);color:white}select,input[type=number]{background:#020617;color:var(--text);border:1px solid var(--border)}input[type=range]{width:210px}.reader{min-height:310px;border-radius:24px;background:radial-gradient(circle at top,#1e293b,#020617);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:18px}.word{font-size:clamp(44px,13vw,116px);font-weight:950;line-height:1.1;overflow-wrap:anywhere}.kid .word{font-size:clamp(58px,16vw,136px)}.focus:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#38bdf888}.meta{position:absolute;bottom:12px;inset-inline:14px;color:var(--muted);display:flex;justify-content:space-between}.progress{height:12px;border-radius:99px;background:#020617;border:1px solid var(--border);overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#1e293b;border:1px solid var(--border);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}.rtl{direction:rtl}.ltr{direction:ltr}.hint{color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap"><h1>קורא מהיר</h1><p class="sub">תרגול קריאה בעברית ובאנגלית, מותאם לטלפון, עם שמירת התקדמות מקומית.</p><div class="grid"><section class="panel"><label>טקסט לתרגול</label><textarea id="txt"></textarea><div class="row"><button id="load">טען</button><button id="he" class="secondary">דוגמה עברית</button><button id="en" class="secondary">English</button><button id="clear" class="danger">נקה</button></div><label>מהירות: <span id="wpmLbl">300</span> WPM</label><div class="row"><input id="wpm" type="range" min="80" max="1000" step="10" value="300"><input id="wpmNum" type="number" min="80" max="1000" step="10" value="300"></div><label>מילים בכל פעימה</label><select id="chunk"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label>כיוון</label><select id="dir"><option value="auto">אוטומטי</option><option value="rtl">עברית</option><option value="ltr">English</option></select><label>מצב</label><select id="mode"><option value="regular">רגיל</option><option value="kid">ילדים</option><option value="focus">קו מיקוד</option></select><p class="hint">אפשר להתקין למסך הבית: Safari/Chrome ואז Share או תפריט, Add to Home Screen.</p></section><section class="panel"><div id="reader" class="reader"><div id="word" class="word">מוכן?</div><div class="meta"><span id="count">0 / 0</span><span id="left">00:00</span></div></div><div class="progress"><div id="bar" class="bar"></div></div><div class="row"><button id="play" class="ok">התחל</button><button id="pause" class="secondary">עצור</button><button id="back" class="secondary">אחורה</button><button id="next" class="secondary">קדימה</button><button id="reset" class="danger">איפוס</button></div><div class="stats"><div class="stat"><b id="sWords">0</b><span>מילים</span></div><div class="stat"><b id="sDone">0%</b><span>התקדמות</span></div><div class="stat"><b id="sLeft">00:00</b><span>נותר</span></div></div></section></div></div>
<script>
const $=id=>document.getElementById(id);let words=[],i=0,timer=null,playing=false;const sampleHe='קריאה מהירה היא אימון של קשב קצב והבנה. מתחילים במהירות נוחה ומעלים קצב רק כשהמשמעות נשארת ברורה.';const sampleEn='Speed reading is focused practice. Start slowly, keep comprehension clear, and raise the pace gradually.';function save(){localStorage.readerApp=JSON.stringify({txt:txt.value,wpm:wpm.value,chunk:chunk.value,dir:dir.value,mode:mode.value,i})}function restore(){try{let d=JSON.parse(localStorage.readerApp||'{}');txt.value=d.txt||sampleHe;wpm.value=d.wpm||300;wpmNum.value=wpm.value;wpmLbl.textContent=wpm.value;chunk.value=d.chunk||1;dir.value=d.dir||'auto';mode.value=d.mode||'regular';i=d.i||0}catch(e){txt.value=sampleHe}}function split(){return txt.value.replace(/[־–—]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean)}function heb(s){return /[\u0590-\u05FF]/.test(s)}function shown(){return words.slice(i,i+Number(chunk.value)).join(' ')}function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function update(){let cur=words.length?shown():'הדבק טקסט וטען';word.textContent=cur||'סיימת';let d=dir.value==='auto'?(heb(cur||txt.value)?'rtl':'ltr'):dir.value;reader.classList.toggle('rtl',d==='rtl');reader.classList.toggle('ltr',d==='ltr');reader.classList.toggle('kid',mode.value==='kid');reader.classList.toggle('focus',mode.value==='focus');let done=words.length?Math.min(100,Math.round(i/words.length*100)):0;count.textContent=Math.min(i+1,words.length)+' / '+words.length;bar.style.width=done+'%';let rem=(Math.max(words.length-i,0)/Number(wpm.value))*60;left.textContent=fmt(rem);sWords.textContent=words.length;sDone.textContent=done+'%';sLeft.textContent=fmt(rem);save()}function loadText(){words=split();i=Math.min(i,Math.max(0,words.length-1));update()}function stop(){playing=false;if(timer)clearInterval(timer);timer=null}function tick(){if(i>=words.length){stop();word.textContent='סיימת';bar.style.width='100%';return}update();i+=Number(chunk.value)}function playRun(){if(!words.length)loadText();if(playing)return;playing=true;tick();timer=setInterval(tick,Math.max(60,60000/Number(wpm.value)*Number(chunk.value)))}load.onclick=()=>{i=0;loadText()};play.onclick=playRun;pause.onclick=stop;reset.onclick=()=>{stop();i=0;update()};back.onclick=()=>{i=Math.max(0,i-Number(chunk.value)*5);update()};next.onclick=()=>{i=Math.min(words.length,i+Number(chunk.value)*5);update()};he.onclick=()=>{txt.value=sampleHe;i=0;loadText()};en.onclick=()=>{txt.value=sampleEn;i=0;loadText()};clear.onclick=()=>{txt.value='';words=[];i=0;update()};wpm.oninput=()=>{wpmNum.value=wpm.value;wpmLbl.textContent=wpm.value;update()};wpmNum.oninput=()=>{wpm.value=wpmNum.value;wpmLbl.textContent=wpmNum.value;update()};[chunk,dir,mode].forEach(x=>x.onchange=update);txt.oninput=()=>{words=split();i=Math.min(i,words.length);update()};document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?stop():playRun()}if(e.code==='ArrowLeft'){i=Math.max(0,i-Number(chunk.value));update()}if(e.code==='ArrowRight'){i=Math.min(words.length,i+Number(chunk.value));update()}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});restore();words=split();update();
</script>
</body></html>
