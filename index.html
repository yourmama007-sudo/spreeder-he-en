<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>קורא מהיר</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--ok:#34d399;--danger:#ef4444;--border:#334155;--red:#ff3b30;--zoom:1;--speedPct:18%;--readerY:0px}*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}body{min-height:100svh;padding:10px;font-family:system-ui,Arial,sans-serif;background:linear-gradient(145deg,#020617,#0f172a);color:var(--text)}.wrap{width:min(980px,100%);margin:auto}.title{margin:4px 2px 10px}.title h1{font-size:clamp(24px,7vw,42px);margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:14px}.panel{background:rgba(17,24,39,.92);border:1px solid var(--border);border-radius:20px;padding:10px;margin-bottom:12px;box-shadow:0 18px 44px #0005}.reader{position:relative;min-height:52svh;border-radius:18px;background:radial-gradient(circle at top,#1e293b,#020617);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;overflow:hidden}.word{width:100%;max-width:100%;font-size:clamp(42px,17vw,128px);font-weight:950;line-height:1.08;transform:translateY(var(--readerY)) scale(var(--zoom));transition:transform .12s ease;display:flex;align-items:center;justify-content:center;text-align:center;direction:rtl;unicode-bidi:plaintext}.wordInner{display:inline-block;max-width:100%;white-space:nowrap;text-align:center;direction:rtl;unicode-bidi:isolate}.wordInner.ltr{direction:ltr}.red{color:var(--red)!important;text-shadow:0 0 18px #ff3b3088}.reader.focus:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#38bdf888}.reader.anchor:after{content:"";position:absolute;top:28%;bottom:28%;left:50%;width:2px;transform:translateX(-50%);background:rgba(255,59,48,.42);box-shadow:0 0 18px rgba(255,59,48,.55);border-radius:99px;pointer-events:none}.reader.kid .word{font-size:clamp(54px,20vw,150px)}.meta{position:absolute;bottom:9px;inset-inline:10px;color:var(--muted);display:flex;justify-content:space-between;font-size:12px}.fullBtn{position:absolute;top:10px;left:10px;z-index:8;width:42px;height:42px;border-radius:14px;border:1px solid rgba(248,250,252,.32);background:rgba(2,6,23,.18);color:#f8fafc;backdrop-filter:blur(8px);font-size:22px;box-shadow:none}.readerPlayBtn{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:8;width:min(220px,58%);height:50px;border-radius:999px;background:rgba(52,211,153,.92);color:#042016;font-size:18px;font-weight:950;box-shadow:0 12px 32px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px)}.readerPlayBtn.paused{background:rgba(251,191,36,.94);color:#271400}.moveControls{position:absolute;top:58px;left:10px;z-index:8;display:none;grid-template-columns:42px;gap:6px}.moveControls button{width:42px;height:38px;min-height:38px;border-radius:12px;background:rgba(2,6,23,.28);border:1px solid rgba(248,250,252,.25);color:#f8fafc;padding:0;backdrop-filter:blur(8px)}.pseudoFull .moveControls{display:grid}.progress{height:11px;border-radius:999px;background:#020617;border:1px solid var(--border);overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa)}button,select,input,textarea{font:inherit}button,select,input[type=number],input[type=text],input[type=file]{border-radius:14px;padding:10px;font-size:15px;font-weight:800;max-width:100%}button{border:0;background:var(--accent);color:#04111c;cursor:pointer;min-height:44px}.danger{background:var(--danger);color:white}.secondary{background:#e2e8f0;color:#0f172a}.game{background:#fbbf24;color:#281300}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.controls button{width:100%;min-height:46px;font-size:22px;padding:8px}.controls #reset{grid-column:1/-1;min-height:50px;font-size:17px;font-weight:950}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}.speedBox{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;min-height:44px;border:1px solid rgba(56,189,248,.38);border-radius:14px;background:linear-gradient(90deg,rgba(56,189,248,.35) 0 var(--speedPct),#020617 var(--speedPct) 100%);color:var(--muted);font-weight:800}.speedBox select{width:auto;min-width:100px;background:rgba(2,6,23,.75);color:var(--text);border:1px solid var(--border)}.zoomLbl{display:flex;align-items:center;justify-content:center;background:#020617;border:1px solid var(--border);border-radius:14px;color:var(--text);font-weight:900}.speak.on{background:#34d399;color:#052e1e;box-shadow:0 0 0 3px rgba(52,211,153,.22)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}.stat{background:#1e293b;border:1px solid var(--border);border-radius:14px;padding:8px;text-align:center}.stat b{display:block;font-size:clamp(16px,5vw,20px)}.stat span{color:var(--muted);font-size:11px}details{overflow:hidden}summary{list-style:none;cursor:pointer;padding:14px;font-weight:950;background:rgba(30,41,59,.55);border-radius:18px}summary::-webkit-details-marker{display:none}summary:after{content:'⌄';float:left;color:var(--accent)}details[open] summary:after{content:'⌃'}.inner{padding:12px}textarea{width:100%;min-height:170px;border-radius:16px;padding:12px;font-size:16px;line-height:1.55;background:#020617;color:var(--text);border:1px solid var(--border);direction:auto;resize:vertical}label{display:block;margin:10px 0 6px;font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}select,input[type=text],input[type=file]{width:100%;background:#020617;color:var(--text);border:1px solid var(--border)}input[type=number]{width:82px;text-align:center;background:#020617;color:var(--text);border:1px solid var(--border)}.toggle{display:flex;gap:9px;align-items:center;margin-top:10px}.toggle input{width:20px;height:20px}.hint,.status{color:var(--muted);font-size:13px;line-height:1.4}.grid{display:grid;gap:12px}@media(min-width:720px){body{padding:16px}.panel{padding:14px}.reader{min-height:48svh}.tools{grid-template-columns:1.3fr repeat(5,1fr)}.speedBox{grid-column:auto}.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.stats{grid-template-columns:repeat(2,1fr)}.word{font-size:clamp(40px,16vw,82px)}.readerPlayBtn{bottom:38px;height:46px;width:min(190px,62%)}}@media(orientation:landscape) and (max-height:520px){.reader{min-height:62svh}.readerPlayBtn{bottom:28px;height:42px}.meta{bottom:6px}.word{font-size:clamp(36px,12vw,86px)}}.pseudoFull{position:fixed!important;inset:0!important;z-index:9999!important;background:#020617!important;border:0!important;border-radius:0!important;padding:10px!important;display:flex!important;flex-direction:column!important;justify-content:center!important}.pseudoFull .reader{min-height:74svh}.pseudoFull .stats{display:none}.pseudoFull .readerPlayBtn{bottom:34px}
</style>
</head>
<body>
<div class="wrap">
 <div class="title"><h1>קורא מהיר</h1><p>מסך קריאה, ניקוד, הקראה, זמן פנוי ומשחק.</p></div>
 <section id="readerPanel" class="panel">
  <div id="reader" class="reader"><button id="fullBtn" class="fullBtn">⛶</button><div class="moveControls"><button id="moveUp">↑</button><button id="moveReset">•</button><button id="moveDown">↓</button></div><div id="word" class="word">מוכן?</div><button id="play" class="readerPlayBtn">▶ התחל</button><div class="meta"><span id="count">0 / 0</span><span id="left">00:00</span></div></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div class="controls"><button id="reset" class="danger">↺ איפוס</button><button id="back" class="secondary" title="אחורה">↩</button><button id="next" class="secondary" title="קדימה">↪</button><button id="speakBtn" class="secondary speak" title="הקראה">🔊</button><button id="fullBtn2" class="secondary" title="מסך מלא">⛶</button></div>
  <div class="tools"><label class="speedBox">מהירות <select id="wpmSelect"><option>100</option><option>150</option><option>200</option><option>250</option><option selected>300</option><option>350</option><option>400</option><option>450</option><option>500</option><option>600</option><option>700</option><option>800</option><option>1000</option><option>1200</option></select></label><button id="zoomDown" class="secondary">− 🔍</button><div class="zoomLbl" id="zoomLbl">100%</div><button id="zoomUp" class="secondary">+ 🔍</button><button id="gameBtn" class="game">🎮 משחק</button><button id="timeBtn" class="secondary">⏱ זמן</button></div>
  <div class="row" style="justify-content:center"><input id="minutes" type="number" min="1" max="120" value="5"><span class="hint">דקות פנויות</span></div>
  <div class="stats"><div class="stat"><b id="sWords">0</b><span id="unitLbl">מילים</span></div><div class="stat"><b id="sDone">0%</b><span>התקדמות</span></div><div class="stat"><b id="sLeft">00:00</b><span>נותר</span></div><div class="stat"><b id="score">0</b><span>נקודות</span></div></div>
 </section>
 <details class="panel" open><summary>📄 טקסט וייבוא</summary><div class="inner"><label>טקסט לתרגול</label><textarea id="txt"></textarea><label>ייבוא קובץ</label><input id="fileIn" type="file" accept=".txt,.docx,.pdf,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><p id="importStatus" class="status">תומך TXT, DOCX ו-PDF עם שכבת טקסט.</p><div class="row"><button id="load">טען</button><button id="he" class="secondary">דוגמה עברית</button><button id="en" class="secondary">English</button><button id="clear" class="danger">נקה</button></div></div></details>
 <details class="panel"><summary>⚙️ הגדרות</summary><div class="inner grid"><div><label>מילים בכל פעימה</label><select id="chunk"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label>ניווט</label><select id="navUnit"><option value="words">לפי מילים</option><option value="lines">לפי שורות</option></select><label>מצב</label><select id="mode"><option value="regular">רגיל</option><option value="kid">ילדים</option><option value="focus">קו מיקוד</option></select></div><div><label class="toggle"><input id="redFocus" type="checkbox" checked> אות אדומה באמצע המילה</label><label class="toggle"><input id="fixedAnchor" type="checkbox"> סמן עוגן קבוע במרכז</label><label class="toggle"><input id="lettersOnly" type="checkbox" checked> הסר סימני פיסוק וסימנים</label><label class="toggle"><input id="showNikud" type="checkbox"> הצג/שמור ניקוד בעברית</label><p class="hint">המילה נשארת טבעית וממורכזת. סמן העוגן הקבוע נותן נקודת מיקוד קבועה בלי לפרק את המילה.</p></div></div></details>
 <details class="panel"><summary>🎲 ג׳נרטור</summary><div class="inner"><div class="row"><select id="level"><option value="easy">קל</option><option value="medium">בינוני</option><option value="hard">מתקדם</option></select><button id="genBtn" class="secondary">צור טקסט</button></div></div></details>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});}
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);let units=[],lines=[],i=0,timer=null,playing=false,game=false,points=0,sessionEnd=null,zoom=1,speechOn=false,lastSpoken='',readerY=0;
const sampleHe='קריאה מהירה היא אימון של קשב קצב והבנה. אפשר לשלב ראייה ושמיעה כדי לשמור על מיקוד טוב יותר.';const sampleEn='Speed reading is focused practice. You can combine sight and sound to improve attention.';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function stripMarks(s){return String(s||'').replace(/[\u0591-\u05C7]/g,'')}
function cleanText(s){s=String(s||'').normalize('NFC');if(!showNikud.checked)s=stripMarks(s);if(lettersOnly.checked){if(showNikud.checked){s=s.replace(/[^\p{L}\p{M}\p{N}\s\n]/gu,' ')}else{s=s.replace(/[^\p{L}\p{N}\s\n]/gu,' ')}}if(!showNikud.checked)s=stripMarks(s);return s.replace(/[ \t]+/g,' ').replace(/\n\s+/g,'\n').trim()}
function makeUnits(){let t=cleanText(txt.value);lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);let words=t.replace(/\n/g,' ').split(/\s+/).filter(Boolean);units=navUnit.value==='lines'?lines:words;unitLbl.textContent=navUnit.value==='lines'?'שורות':'מילים'}
function midIndex(w){let a=[...w];let letters=a.map((ch,idx)=>({ch,idx})).filter(o=>/[\p{L}\p{N}]/u.test(o.ch));if(!letters.length)return 0;return letters[Math.floor((letters.length-1)/2)].idx}
function paintOne(w){w=cleanText(w);let a=[...w];if(!a.length)return '';let j=midIndex(w);let isHeb=/[\u0590-\u05FF]/.test(w);let html=a.map((ch,idx)=>idx===j?'<span class="red">'+esc(ch)+'</span>':esc(ch)).join('');return '<span class="wordInner '+(isHeb?'rtl':'ltr')+'" dir="'+(isHeb?'rtl':'ltr')+'">'+html+'</span>'}
function paint(s){return String(s).split(/\s+/).filter(Boolean).map(paintOne).join(' ')}
function shown(){return units.slice(i,i+(navUnit.value==='lines'?1:Number(chunk.value))).join(' ')}function wpm(){return Number(wpmSelect.value||300)}function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function remainingWords(){return units.slice(i).join(' ').split(/\s+/).filter(Boolean).length}
function syncSpeed(){let p=Math.max(0,Math.min(100,((wpm()-100)/(1200-100))*100));document.querySelector('.speedBox').style.setProperty('--speedPct',p+'%')}function speak(text,force=false){if(!speechOn&&!force)return;text=cleanText(text);if(!text||text==='מוכן?'||text===lastSpoken&&!force)return;lastSpoken=text;if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=/[\u0590-\u05FF]/.test(text)?'he-IL':'en-US';u.rate=.95;speechSynthesis.speak(u)}
function syncReaderY(){document.documentElement.style.setProperty('--readerY',readerY+'px')}function updatePlayLabel(){play.textContent=playing?'⏸ השהה':'▶ התחל';play.classList.toggle('paused',playing)}
function update(){document.documentElement.style.setProperty('--zoom',zoom);zoomLbl.textContent=Math.round(zoom*100)+'%';syncReaderY();syncSpeed();updatePlayLabel();let cur=units.length?shown():'הדבק טקסט וטען';let clean=cleanText(cur);word.innerHTML=redFocus.checked?paint(clean):'<span class="wordInner" dir="auto">'+esc(clean)+'</span>';reader.classList.toggle('kid',mode.value==='kid');reader.classList.toggle('focus',mode.value==='focus');reader.classList.toggle('anchor',fixedAnchor.checked);let done=units.length?Math.min(100,Math.round(i/units.length*100)):0;count.textContent=Math.min(i+1,units.length)+' / '+units.length;bar.style.width=done+'%';let rem=sessionEnd?Math.max(0,(sessionEnd-Date.now())/1000):(remainingWords()/wpm())*60;left.textContent=fmt(rem);sWords.textContent=units.length;sDone.textContent=done+'%';sLeft.textContent=fmt(rem);score.textContent=points;speak(clean)}
function loadText(){makeUnits();i=Math.min(i,Math.max(0,units.length-1));update()}function hardStop(){playing=false;if(timer)clearInterval(timer);timer=null;sessionEnd=null;if('speechSynthesis'in window)speechSynthesis.cancel();updatePlayLabel()}function pauseRun(){playing=false;if(timer)clearInterval(timer);timer=null;if('speechSynthesis'in window)speechSynthesis.cancel();updatePlayLabel()}function step(){return navUnit.value==='lines'?1:Number(chunk.value)}function tick(){if(sessionEnd&&Date.now()>=sessionEnd){hardStop();return}if(i>=units.length){hardStop();word.innerHTML='<span class="wordInner">סיימת</span>';bar.style.width='100%';return}let cur=shown();update();if(game)points+=cleanText(cur).split(/\s+/).filter(Boolean).length;i+=step()}function interval(){return Math.max(80,60000/wpm()*(cleanText(shown()).split(/\s+/).filter(Boolean).length||1))}function playRun(){if(!units.length)loadText();if(playing)return;playing=true;updatePlayLabel();tick();timer=setInterval(tick,interval())}function togglePlay(){playing?pauseRun():playRun()}
async function readFile(f){let n=f.name.toLowerCase();if(n.endsWith('.txt')||f.type.startsWith('text/'))return await f.text();let buf=await f.arrayBuffer();if(n.endsWith('.docx')){let r=await mammoth.extractRawText({arrayBuffer:buf});return r.value}if(n.endsWith('.pdf')){let pdf=await pdfjsLib.getDocument({data:buf}).promise,out=[];for(let p=1;p<=pdf.numPages;p++){let pg=await pdf.getPage(p),tc=await pg.getTextContent();out.push(tc.items.map(x=>x.str).join(' '))}let t=out.join('\n\n').trim();if(t.replace(/\s/g,'').length<20)throw Error('לא נמצאה שכבת טקסט ב-PDF');return t}throw Error('סוג קובץ לא נתמך')}
function randomText(){let pools={easy:['בית','ילד','שמש','מים','דרך','ספר','כלב','עץ','חבר','שמחה','אור','ים'],medium:['קריאה','מהירות','תרגול','מחשבה','משמעות','ריכוז','מטרה','למידה','התקדמות','יכולת'],hard:['אסטרטגיה','התבוננות','קוגניציה','פרשנות','אינטנסיביות','התמודדות','התפתחות','מורכבות','אפקטיביות']};let arr=pools[level.value],n=level.value==='easy'?70:level.value==='medium'?110:150;txt.value=Array.from({length:n},()=>arr[Math.floor(Math.random()*arr.length)]).join(' ');i=0;loadText()}
function toggleFull(){readerPanel.classList.toggle('pseudoFull')}fileIn.onchange=async()=>{let f=fileIn.files[0];if(!f)return;try{importStatus.textContent='קורא קובץ...';txt.value=(await readFile(f)).trim();i=0;loadText();importStatus.textContent='נטען: '+f.name}catch(e){importStatus.textContent='שגיאה: '+e.message}};
play.onclick=togglePlay;reset.onclick=()=>{hardStop();i=0;points=0;update()};back.onclick=()=>{i=Math.max(0,i-step()*5);update()};next.onclick=()=>{i=Math.min(units.length,i+step()*5);update()};load.onclick=()=>{i=0;loadText();scrollTo({top:0,behavior:'smooth'})};he.onclick=()=>{txt.value=sampleHe;i=0;loadText()};en.onclick=()=>{txt.value=sampleEn;i=0;loadText()};clear.onclick=()=>{txt.value='';units=[];i=0;update()};wpmSelect.onchange=update;zoomDown.onclick=()=>{zoom=Math.max(.7,zoom-.1);update()};zoomUp.onclick=()=>{zoom=Math.min(1.8,zoom+.1);update()};speakBtn.onclick=()=>{speechOn=!speechOn;speakBtn.classList.toggle('on',speechOn);speakBtn.textContent='🔊';if(speechOn)speak(word.textContent,true);else if('speechSynthesis'in window)speechSynthesis.cancel()};timeBtn.onclick=()=>{sessionEnd=Date.now()+Number(minutes.value||5)*60000;update()};gameBtn.onclick=()=>{game=!game;gameBtn.textContent=game?'🎮 פעיל':'🎮 משחק'};fullBtn.onclick=toggleFull;fullBtn2.onclick=toggleFull;moveUp.onclick=()=>{readerY=Math.max(-140,readerY-10);update()};moveDown.onclick=()=>{readerY=Math.min(140,readerY+10);update()};moveReset.onclick=()=>{readerY=0;update()};genBtn.onclick=randomText;[chunk,navUnit,mode,redFocus,fixedAnchor,lettersOnly,showNikud].forEach(x=>x.onchange=()=>{loadText()});txt.oninput=()=>{makeUnits();i=Math.min(i,units.length);update()};document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.code==='ArrowLeft'){i=Math.max(0,i-step());update()}if(e.code==='ArrowRight'){i=Math.min(units.length,i+step());update()}});txt.value=sampleHe;loadText();
</script>
</body></html>
